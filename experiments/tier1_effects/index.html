<!doctype html><html lang="zh"><meta charset="utf-8"><title>Tier-1 e-graph</title>
<style>body{margin:24px;background:#fafaf7;color:#263637;font:16px system-ui}select,a{margin-right:16px}iframe{width:100%;height:78vh;border:1px solid #cad6d3;background:white}p{max-width:1000px;line-height:1.6}</style>
<h1>Tier-1 e-graph</h1><p>来自原生 egglog 小规模语义实验，尚非 Math 历史。绿色为 ready，橙色为 pending；虚线说明前提或候选替代，点线说明 effect。原组合保留，冗余证书仅针对当前使用。</p>
<p><select id="case"><option value="union">Equality effect 解锁</option><option value="redundancy">局部依赖冗余</option><option value="before">Effect 到达前</option><option value="after">Effect 到达后</option></select><select id="mode"><option value="">上下文 / effect 视图</option value=".native">完整原生图</option></select><a id="svg" target="_blank">单独打开 SVG</a><a id="json" target="_blank">完整原生 JSON</a></p>
<iframe id="view" title="tier1 graph"></iframe><p>完整图保留所有导出节点与边；超长节点标签仅缩短显示，完整内容保存在 tooltip 和 JSON 中。内部关系表的 Unit 输出不代表 Ctx 被 union。</p>
<script>const c=document.getElementById('case'),m=document.getElementById('mode');function show(){let stem=c.value+m.value;document.getElementById('view').src=stem+'.svg';document.getElementById('svg').href=stem+'.svg';document.getElementById('json').href=c.value+'.native.json'}c.onchange=m.onchange=show;show()</script></html>
