[package]
name = "egg_layout"
version = "0.1.0"
edition = "2024"
default-run = "egg_layout"
autobins = false

[dependencies]
egglog = { path = "egglog", default-features = false, features = ["graphviz"] }
serde_json = "1.0"
serde = { version = "1", features = ["derive", "rc"] }
rayon = "1"

# The browser build needs a JS time source and getrandom backend.
[target.'cfg(target_arch = "wasm32")'.dependencies]
web-time = "1"
getrandom = { version = "0.3", features = ["wasm_js"] }

[[bin]]
name = "egg_layout"
path = "src/main.rs"
