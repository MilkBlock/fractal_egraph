[package]
name = "eggfuse-cell-runtime"
version = "0.1.0"
edition = "2024"

[dependencies]
eggfuse-structural-key = { path = "../structural-key" }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
sha2 = "0.10"
smallvec = "1"

[profile.release]
debug = 1
