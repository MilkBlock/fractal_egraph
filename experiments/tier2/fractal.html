<script>
const data=JSON.parse(document.getElementById('data').textContent),$=id=>document.getElementById(id);
function text(id,value){$(id).textContent=value}
text('coverage',`此视图覆盖 ${data.stats.visible_unique_contexts} / ${data.stats.total_comb_templates} 个组合模板；其余不在本次 fractal 区域内，默认隐藏。这不是整个 tier-0 图的无损压缩率。`);
for(const [n,label] of [[data.stats.maximal_chains,'条最大轨道'],[data.stats.applications,'次已观察应用'],[data.stats.higher_rules,'个幂表示已合并展示']]){let d=document.createElement('div');let b=document.createElement('b');b.textContent=n;d.append(b,document.createTextNode(' '+label));$('stats').append(d)}
function addButton(track,lane,key,label,cls){let b=document.createElement('button');b.type='button';b.textContent=label;b.className=cls||'';b.dataset.lane=lane.id;b.dataset.step=key;b.setAttribute('aria-label',`${lane.id} ${key==='trigger'?'trigger 上下文':key==='future'?'未验证的延伸':'第 '+key+' 次应用'}`);b.setAttribute('aria-pressed','false');b.onclick=()=>{location.hash=lane.id+'/'+key};track.append(b)}
for(const lane of data.lanes){let card=document.createElement('article');card.className='card';let h=document.createElement('h2');h.textContent=`${lane.rule} · ${lane.events.length} 次稳定展开`;let meta=document.createElement('div');meta.className='muted';meta.textContent=`${lane.id} / ${lane.operator} · 保留实际父依赖，不拼接无关实例`;card.append(h,meta);let track=document.createElement('div');track.className='track';addButton(track,lane,'trigger','trigger','trigger');for(let i=1;i<=lane.events.length;i++){let arrow=document.createElement('span');arrow.className='arrow';arrow.textContent='→';track.append(arrow);addButton(track,lane,String(i),String(i))}addButton(track,lane,'future','…','future');card.append(track);let note=document.createElement('p');note.className='muted';note.textContent='重复前缀不再单独画图；细节只在点击后渲染。';card.append(note);$('tracks').append(card)}
function show(){let [id,key]=location.hash.slice(1).split('/');let lane=data.lanes.find(l=>l.id===id)||data.lanes[0];if(!lane)return;if(!['trigger','future',...lane.events.map((_,i)=>String(i+1))].includes(key))key='trigger';
for(const b of document.querySelectorAll('.track button'))b.setAttribute('aria-pressed',String(b.dataset.lane===lane.id&&b.dataset.step===key));
text('higher',lane.higher);$('known-box').hidden=key==='future';$('future-box').hidden=key!=='future';
if(key==='future'){text('detail-title',`${lane.rule} · …`);text('tags','延伸候选 / 非已观察应用');text('why',`这条轨道目前只验证到第 ${lane.events.length} 次。`);text('future-box','相同的 relative-binding 更新方式提示后续可能继续。但当前数据没有第 '+(lane.events.length+1)+' 次应用，也未证明它的触发前提始终成立。因此这里不生成结果、不虚构 e-node。');return}
let event=key==='trigger'?lane.trigger:lane.events[Number(key)-1],node=data.nodes[event];text('detail-title',key==='trigger'?`${lane.rule} 的 trigger 位置`:`${lane.rule} · 第 ${key} 次应用`);text('tags',`${node.comb} · 事件 ${event} · ${node.kind}`);
text('why',key==='trigger'?`这是稳定链开始前的已观察上下文，由 ${node.rule} 形成。它提供下一次应用所需的接口；点击数字 1 可查看消费哪些父输出。此位置不是已证明的最小充分触发条件。`:`本步消费前一位置的输出，使用 ${lane.operator} 的相同接口更新方式。下方给出这一位置已有的整条组合，而不是假设未来展开。`);
$('links').replaceChildren();let a=document.createElement('a');a.href='../tier1_extract/index.html#'+node.comb.slice(1);a.textContent='在 tier-1 中定位 '+node.comb;$('links').append(a);
text('equation',node.equation);text('update',lane.update.join('\n'));text('source-title',key==='trigger'?'形成这个上下文的原规则':'本步 apply 的原规则');text('source',node.source);text('result',node.combined||'尚不能导出单条 tier-0 规则：'+(node.reason||'无可用降级结果'));text('tier1',node.tier1);text('evidence',JSON.stringify({event,parent_events:node.parent_events,external_interfaces:node.external_routes,consumed_parent_roles:node.source_routes},null,2));
}window.addEventListener('hashchange',show);show();
