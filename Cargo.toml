[package]
name = "eggfuse-bake"
version = "0.1.0"
edition = "2024"
description = "Native analysis and bounded Cell Bake frontend for EggFuse"
autobins = false

[dependencies]
eggfuse-structural-key = { path = "engine/structural-key" }
egglog = { path = "egglog", default-features = false, features = ["graphviz", "serde"] }
serde_json = "1.0"
serde = { version = "1", features = ["derive", "rc"] }
rayon = "1"

[workspace]
resolver = "2"
members = ["engine/cell-runtime", "engine/structural-key", "tools/cell-compiler"]
default-members = ["tools/cell-compiler", "engine/cell-runtime"]
exclude = ["egglog"]
