name: Cell CPU
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  cpu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --workspace --all-features --release --locked
      - run: cargo cell-compile --case fact --output out/fact
      - run: cargo cell-run --program out/fact/program.json --output out/run
      - run: cargo cell-bench --program out/fact/program.json --repeat 1
