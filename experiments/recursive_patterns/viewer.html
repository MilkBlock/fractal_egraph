<!doctype html><html lang="zh"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>共享模板与排序</title>
<style>body{font:15px system-ui;background:#f6f8fa;color:#17232b;margin:24px}main{max-width:1150px;margin:auto}section{background:white;border:1px solid #dce3e8;border-radius:10px;padding:18px;margin:16px 0}select{max-width:100%;padding:8px}h1{font-size:25px}.unit{border-top:1px solid #e5e9ed;padding:10px 0;display:flex;gap:8px;align-items:center;flex-wrap:wrap}button{padding:7px;border:1px solid #9cabb7;border-radius:6px;background:#e0edf9;cursor:pointer}.port{background:#e1f1e4}.pending{padding:7px;background:#eee;color:#596670;border-radius:6px}.note{color:#596670}pre{white-space:pre-wrap;overflow-wrap:anywhere;font:12px ui-monospace;line-height:1.5}#detail{max-height:550px;overflow:auto}</style>
<main><h1>共享模板与观测支配排序</h1><p class="note">每个节点代表实际 rule apply。完整观察用 Depth；部分展开保留 SparseExtent。不承诺任意深度可运行，也不为未观察的出口生成 apply 或 fact。</p><select id="pattern" aria-label="递归模板"></select> <select id="instance" aria-label="具体实例"></select><section><h2 id="title"></h2><p id="stats"></p><p id="ranking" class="note"></p><pre id="comb"></pre><div id="graph"></div></section><section><h2>实际 binding / fact / union 证据</h2><pre id="detail">点击 A 或 B apply 查看证据。灰色出口没有相应的已验证 B apply。</pre></section><section><details><summary>模板的输入与出口转移</summary><pre id="schema"></pre></details><details><summary>尚不能组成模板的组</summary><pre id="unsupported"></pre></details></section></main>
<script>
const data=__RECURSIVE_DATA__,pselect=document.getElementById('pattern'),iselect=document.getElementById('instance');const text=(id,v)=>document.getElementById(id).textContent=v;
for(const [n,p]of data.patterns.entries()){let o=document.createElement('option');o.value=n;o.textContent=p.kind==='linear_extension'?`#${p.ranking.rank} ${p.entry_rule} × k`:`#${p.ranking.rank} ${p.entry_rule} → ${p.observed_arity} × ${p.branch_rule} → ${p.entry_rule}`;pselect.append(o)}
function changePattern(){let p=data.patterns[+pselect.value];iselect.replaceChildren();if(!p){text('title','未发现满足当前条件的递归模板');text('unsupported',JSON.stringify(data.unsupported_groups,null,2));return}for(const [n,i]of p.instances.entries()){let o=document.createElement('option');o.value=n;o.textContent=`入口事件 ${i.entry_event} · ${i.extent_kind}${i.depth===null?'':' '+i.depth}`;iselect.append(o)}draw()}
function draw(){let p=data.patterns[+pselect.value],i=p?.instances[+iselect.value];if(!i)return;text('title',p.kind==='linear_extension'?`${p.entry_rule} · ${i.extent_kind}`:`${p.entry_rule} / ${p.branch_rule} · ${i.extent_kind}`);text('stats',`${i.observed_units} 个实际单元，${i.observed_apply_events} 次实际 apply。启动上下文事件 ${i.start_context_event}；只显示已观察范围。`);text('comb',i.fractal_comb);text('ranking',`去重覆盖 ${p.ranking.unique_apply_events} 次 apply；本排名新增覆盖 ${p.ranking.new_apply_events} 次；定义 ${p.ranking.definition_bytes} 字节。观测支配：${data.observed_dominance.filter(e=>e.dominant===p.id).map(e=>e.dominated).join(', ')||'无证书'}。语义 dominance 尚未证明。`);text('schema',JSON.stringify({entry:data.step_templates[p.entry_template],ports:p.ports.map(port=>({...port,definition:data.step_templates[port.step_template]})),learning_witnesses:p.learning_witnesses,additional_returning_witnesses:p.additional_returning_witnesses},null,2));text('unsupported',JSON.stringify(data.unsupported_groups,null,2));let graph=document.getElementById('graph');graph.replaceChildren();const show=(event)=>text('detail',JSON.stringify(data.event_witnesses[String(event)],null,2));for(const n of i.nodes){let row=document.createElement('div');row.className='unit';let b=document.createElement('button');b.textContent=`单元 ${n.local} · ${p.entry_rule} #${n.entry_event}`;b.dataset.event=n.entry_event;b.onclick=()=>show(n.entry_event);row.append(b);for(const port of n.ports){let el=document.createElement(port.observed_child===null?'span':'button');el.className=port.observed_child===null?'pending':'port';el.textContent=`出口 ${port.port} · ${port.observed_child===null?'B apply 未验证':p.branch_rule+' #'+port.observed_child} → ${port.target!==null?'单元 '+port.target:port.state==='ReturnFrontier'?'后续 A apply 未观察':port.state==='BoundaryPort'?'边界':'未观察'}`;if(port.observed_child!==null){el.dataset.event=port.observed_child;el.onclick=()=>show(port.observed_child)}row.append(el)}graph.append(row)}}
pselect.onchange=changePattern;iselect.onchange=draw;changePattern();
</script></html>
