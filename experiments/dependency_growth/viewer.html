<!doctype html><html lang="zh"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>参数化依赖候选</title>
<style>body{font:15px system-ui;margin:24px;background:#fafafa;color:#17232b}main{max-width:1100px;margin:auto}h1{font-size:25px}select{max-width:100%;padding:8px}section{background:white;padding:18px;margin:16px 0;border:1px solid #dce2e6;border-radius:9px}.row{display:flex;gap:7px;align-items:center;flex-wrap:wrap;margin:8px 0}.label{width:160px;font-size:13px}button{border:1px solid #99adba;border-radius:6px;padding:7px;background:#e5eef8;cursor:pointer}button.held{background:#e0f2e4}button.unknown{background:#ffe1df}pre{white-space:pre-wrap;overflow-wrap:anywhere;font:12px ui-monospace;line-height:1.5}.note{color:#596873}summary{cursor:pointer}#detail{max-height:600px;overflow:auto}</style>
<main><h1>主干与增长旁支</h1><p class="note">只显示真实观察到的位置。前 3 层用于候选模板，后续层用于检验；不证明无限规律，也不把未出现的位置当成事实。</p><select id="family" aria-label="候选族"></select><section><h2 id="status"></h2><p id="counts"></p><p id="spine" class="note"></p><div id="grid"></div></section><section><h2>位置、binding 与 effect 证据</h2><pre id="detail">点击一个位置查看原始 apply 与输入来源。</pre></section><section><details><summary>未纳入模型的边界／歧义</summary><pre id="exceptions"></pre></details><details><summary>前 3 层学习到的模板</summary><pre id="templates"></pre></details></section></main>
<script>
const data=__GROWTH_DATA__,sel=document.getElementById('family');
const text=(id,v)=>document.getElementById(id).textContent=v;
(data.reports||[]).forEach((r,i)=>{let o=document.createElement('option');o.value=i;o.textContent=`${i+1}. ${r.family} · ${r.status}`;sel.append(o)});
function draw(){let r=data.reports[Number(sel.value)];if(!r){text('status','没有可分析的主干旁支族');return}text('status',r.status);text('counts',`观察 ${r.observed_events} 次 apply；定位 ${r.mapped_events} 次；边界/歧义 ${r.exceptions.length} 次。模板 ${r.templates.length} 个。`);text('spine','主干 apply：'+r.spine.join(' → '));let grid=document.getElementById('grid');grid.replaceChildren();for(const layer of r.layers){let row=document.createElement('div');row.className='row';let label=document.createElement('span');label.className='label';label.textContent=`d=${layer.d} · ${layer.split==='training'?'训练':'后续检验'} · ${layer.mapped}/${layer.observed}`;row.append(label);for(const n of r.instances.filter(n=>n.d===layer.d)){let b=document.createElement('button');b.textContent=`(${n.d},${n.j})`;b.className=n.template===null?'unknown':layer.split==='held_out'?'held':'';b.dataset.event=n.event;b.onclick=()=>text('detail',JSON.stringify(n,null,2));row.append(b)}grid.append(row)}text('exceptions',JSON.stringify(r.exceptions,null,2));text('templates',JSON.stringify(r.templates,null,2));}
sel.onchange=draw;draw();
</script></html>
