[alias]
cpu = "run --offline --release --manifest-path engine/cpu/Cargo.toml --"
cell-compile = "run --release --locked --manifest-path tools/cell-compiler/Cargo.toml -- compile"
cell-run = "run --release --locked --manifest-path engine/cell-runtime/Cargo.toml --"
cell-bench = "bench --locked --manifest-path tools/cell-compiler/Cargo.toml --bench cell --"
cell-iterate = "run --release --locked --manifest-path tools/cell-compiler/Cargo.toml --features iterative-bake -- iterate"
cell-calibrate-markers = "run --release --locked --manifest-path tools/cell-compiler/Cargo.toml -- calibrate-markers"
