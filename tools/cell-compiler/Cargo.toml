[package]
name = "eggfuse-cell-compiler"
version = "0.1.0"
edition = "2024"

[dependencies]
eggfuse-bake = { path = "../.." }
egglog = { path = "../../egglog", default-features = false, features = ["graphviz", "serde"] }
eggfuse-cell-runtime = { path = "../../engine/cell-runtime" }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
microlp = "0.7.0"

[[bench]]
name = "cell"
harness = false

[features]
iterative-bake = ["eggfuse-cell-runtime/iterative-bake","eggfuse-cell-runtime/slot-transfer-audit"]
