    <pattern id="spokes" width="1" height="1" patternContentUnits="objectBoundingBox">
      <path d="M.5 .03V.97M.03 .5H.97M.168 .168L.832 .832M.168 .832L.832 .168" fill="none" stroke="#b1c2be" stroke-width=".007"/>
    </pattern>
