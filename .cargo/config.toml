[alias]
cell-compile = "run --release --locked -p eggfuse-cell-compiler -- compile"
cell-run = "run --release --locked -p eggfuse-cell-runtime --"
cell-bench = "bench --locked -p eggfuse-cell-compiler --bench cell --"
cell-iterate = "run --release --locked -p eggfuse-cell-compiler --features iterative-bake -- iterate"
