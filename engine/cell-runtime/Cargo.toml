[package]
name = "eggfuse-cell-runtime"
version = "0.1.0"
edition = "2024"

[features]
slot-transfer-audit = []
spine-shapes = []
spine-blocks = []

[dependencies]
eggfuse-structural-key = { path = "../structural-key" }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
sha2 = "0.10"
smallvec = "1"

[profile.release]
debug = 1

[[example]]
name = "bake_spine_blocks"
required-features = ["spine-blocks"]

[[example]]
name = "spine_shape_summary"
required-features = ["spine-blocks"]
