<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">A pelican out for a bicycle ride</title>
  <desc id="desc">A cheerful white pelican with an enormous golden bill pedals a coral bicycle toward the right, beside seaside grasses under a pale blue sky.</desc>
