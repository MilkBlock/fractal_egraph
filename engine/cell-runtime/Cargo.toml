[package]
name = "eggfuse-cell-runtime"
version = "0.1.0"
edition = "2024"

[features]
flat-seal=["sealed-origin"]
sparse-cells = ["sparse-index","embedded-writers","row-ports","lean-buckets","cell-arena","scalar-dispatch","epoch-runs","receipt-spine","solo-spine","sealed-origin","root-directory","point-entries","transient-cell","row-slices","compact-support","inline-completed"]
inline-completed=["embedded-writers","transient-cell"]
compact-support=[]
solo-spine=["shared-cursors"]
row-slices=[]
transient-cell=[]
root-directory=[]
point-entries=[]
sealed-origin=["iterative-bake"]
sieve-frontier=[]
shared-cursors=["iterative-bake"]
receipt-spine=[]
epoch-runs=[]
scalar-dispatch=[]
packed-slots=[]
cell-arena=[]
lean-buckets=["sparse-index"]
row-ports=[]
embedded-writers=[]
sparse-index=[]
storage-metrics=["dep:libc"]
keeper-proof=["rhs-work-audit","rhs-locals"]
rhs-locals = ["iterative-bake"]
rhs-work-audit = ["structural-depth"]
receipt-slots = ["structural-depth"]
structural-depth = ["iterative-bake"]
family-survey = []
family-scan = ["family-survey"]
family-port-trial = ["view-ports"]
family-frontiers = ["family-survey"]
family-overlap = ["family-survey"]
family-replay = ["family-survey"]
view-storage = []
view-consumers = ["view-storage"]
view-ports = ["view-consumers"]
projection-survey = []
projection-stamps = []
projection-semijoin = []
projection-shared = []
default = ["iterative-bake"]
slot-transfer-audit = []
spine-shapes = []
spine-blocks = []
iterative-bake = ["spine-blocks"]

[dependencies]
libc={version="0.2",optional=true}
eggfuse-structural-key = { path = "../structural-key" }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
sha2 = "0.10"
smallvec = "1"
rustc-hash = "2.1"
mimalloc = { version = "0.1", default-features = false }

[[example]]
name = "bake_spine_blocks"
required-features = ["spine-blocks"]


[[example]]
name = "complete_blocks"
required-features = ["iterative-bake"]

[[example]]
name = "rank_families"
required-features = ["family-survey"]

[[example]]
name = "rank_rhs_work"
required-features = ["rhs-work-audit", "rhs-locals"]
