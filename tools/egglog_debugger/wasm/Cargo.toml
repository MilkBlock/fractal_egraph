[package]
name = "egglog-debug-wasm"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
egg_layout = { path = "../../.." }
wasm-bindgen = "0.2"
js-sys = "0.3"
console_error_panic_hook = "0.1"

# The browser build needs a JS time source and the getrandom JS backend.
[target.'cfg(target_arch = "wasm32")'.dependencies]
web-time = "1"
getrandom = { version = "0.3", features = ["wasm_js"] }
