<header><div><div class="eyebrow">EGG_LAYOUT · INSPECTOR</div><h1>Block 与 Prefix</h1><p class="muted scope">实际 apply 事件组成的诊断块。边框表示依赖归属，不是 e-class 的物理分区。</p></div><label class="load">加载新的导出记录<input id="load" type="file" accept="application/json,.json"></label></header>

<div id="notice" class="notice" role="status"></div><div class="legend"><span class="active">有效 block</span><span class="prefix">所选 prefix 的 apply 成员</span><span class="boundary">入口 / 边界；虚线节点表示见证失效</span></div>
<div class="scroller"><div id="diagram" class="diagram" aria-label="Block 依赖图"></div></div>
<section id="detail" class="detail" aria-label="所选 block 的 prefix 和边界"></section>
<div class="explain"><strong>边界口径：</strong>读取的结果来自块外或来源未知，就保留为输入边界；块的有效产出保守保留为潜在导出，即使已经在块内消费。纯关系交汇块没有自动生成的等价快捷 prefix。</div>
<div id="error" class="error" role="alert"></div>

<script>
'use strict';
let data=JSON.parse(document.getElementById('dataset').textContent);
const $=id=>document.getElementById(id), esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const scenarios={chain_growth:'链式增长',cross_block_and_invalidation:'双块交互与失效',union_overlap:'Union：根合并与输入合并'};
const phaseNames={a:'a 后：仅种子',b:'b 后：A+B',c:'c 后：A+B+C',la:'la 后',lb:'lb 后：左侧 block',ra:'ra 后',rb:'rb 后：两侧 block',join:'join 后：交汇 block',delete_LL:'删除 LL 后',before_union:'Union 前',root_union:'只 union 根 e-class',input_union:'再 union 输入端口'};
function options(el,items,value){el.replaceChildren(...items.map(([v,label])=>{const o=document.createElement('option');o.value=String(v);o.textContent=label;return o}));if(value!==undefined)el.value=String(value)}
function current(){return data.cases[Number($('scenario').value)].phases[Number($('phase').value)]}
function selected(){return (current().blocks||[]).find(b=>String(b.id)===$('block').value)}
function init(){if(!Array.isArray(data.cases)||!data.cases.length)throw Error('记录需要非空 cases 数组');options($('scenario'),data.cases.map((c,i)=>[i,scenarios[c.scenario]||c.scenario]),0);setScenario()}
function setScenario(){const c=data.cases[Number($('scenario').value)];options($('phase'),c.phases.map((p,i)=>[i,phaseNames[p.phase]||p.phase]),c.scenario==='union_overlap'?0:c.phases.length-1);setPhase()}
function setPhase(){const p=current();options($('block'),p.blocks.map(b=>[b.id,`Block ${b.id}${b.active?'':' · 待验证'}`]),p.blocks[0]?.id);$('block').disabled=!p.blocks.length;setBlock()}
function setBlock(){const b=selected(),ps=b?.combined_prefixes||[];options($('prefix'),ps.length?ps.map((p,i)=>[i,`${p.rules.join(' → ')}${p.usable?'':' · 失效'}`]):[['none','仅入口 prefix']],ps.length?ps.length-1:'none');$('prefix').disabled=!ps.length;render()}
function eventGraph(b,highlight,usable){const W=270, nodes=b.members||[], ids=new Set(nodes.map(n=>n.match));const edges=(b.dependencies||[]).filter(e=>ids.has(e.producer)&&ids.has(e.consumer));const levels=new Map();for(let pass=0;pass<nodes.length;pass++)for(const n of nodes){const parents=edges.filter(e=>e.consumer===n.match);levels.set(n.match,parents.length?1+Math.max(...parents.map(e=>levels.get(e.producer)||0)):0)}
 const groups=new Map();for(const n of nodes){let level=levels.get(n.match)||0;if(!groups.has(level))groups.set(level,[]);groups.get(level).push(n)}const pos=new Map();for(const[level,ns]of groups)ns.forEach((n,i)=>pos.set(n.match,{x:W*(i+0.5)/ns.length,y:30+level*66}));let h=nodes.length?Math.max(...[...pos.values()].map(p=>p.y))+35:60;
 let html=`<svg class="events" viewBox="0 0 ${W} ${h}" role="img" aria-label="Block ${esc(b.id)} 的实际 apply 依赖"><defs><marker id="arr-${esc(b.id)}" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7" fill="#8f9db1"/></marker></defs>`;const seen=new Set();for(const e of edges){let key=e.producer+':'+e.consumer;if(seen.has(key))continue;seen.add(key);const a=pos.get(e.producer),z=pos.get(e.consumer);html+=`<path class="edge" marker-end="url(#arr-${esc(b.id)})" d="M${a.x},${a.y+17} C${a.x},${a.y+36} ${z.x},${z.y-36} ${z.x},${z.y-18}"/>`}
 for(const n of nodes){const p=pos.get(n.match),hit=highlight.has(n.match);html+=`<g data-match="${esc(n.match)}" data-highlight="${hit}"><title>${esc(n.rule)} · match #${esc(n.match)}</title><rect class="node ${hit?'hit':''} ${hit&&!usable?'old':''}" x="${p.x-53}" y="${p.y-17}" width="106" height="36" rx="7"/><text text-anchor="middle" x="${p.x}" y="${p.y-1}">${esc(Array.from(n.rule).length>14?Array.from(n.rule).slice(0,13).join('')+'…':n.rule)}</text><text class="id" text-anchor="middle" x="${p.x}" y="${p.y+12}">match #${esc(n.match)}</text></g>`}return html+'</svg>'}
function factLabel(f){if(!f)return '未提供当前行';return (f.label||f.table)+(f.eclass?' → '+f.eclass:'')+(f.available===false?' [当前不可定位]':'')}
function render(){const p=current(),b=selected(),pi=Number($('prefix').value),pref=b?.combined_prefixes?.[pi],cs=data.cases[Number($('scenario').value)];$('prev').disabled=Number($('phase').value)===0;$('next').disabled=Number($('phase').value)===cs.phases.length-1;
 let note=`${p.blocks.length} 个 block · ${p.blocks.reduce((a,b)=>a+b.members.length,0)} 个 apply 成员。蓝色只标记所选组合的成员，不表示整个块都是一条串行链。`;
 if(p.phase==='root_union')note='根 e-class 已合并，但两个 prefix 的输入绑定仍不同。当前通过显式保守失效保留两个 block，等待重新验证；不会自动合并。';
 if(p.phase==='input_union')note='输入端口也已 union，两个 prefix 的 canonical 绑定现在相同。当前仍保留两个失效的历史实例；自动重新验证与去重尚未实现。';
 if(p.phase==='before_union')note='两个独立 prefix 实例：模板形状相同，但当前根和输入绑定不同。继续切换阶段观察真实 union 的影响。';
 if(!p.blocks.length)note='此阶段还没有 block；下面列出已记录的拒绝原因。';$('notice').textContent=note;
 const rejected=Object.entries(p.rejected||{}); const rejectionHtml=`<h2>未纳入 block 的事件 · ${rejected.length}</h2><table><thead><tr><th>Match</th><th>原因</th></tr></thead><tbody>${rejected.map(([id,reason])=>`<tr><td>#${esc(id)}</td><td>${esc(reason)}</td></tr>`).join('')||'<tr><td colspan="2">无拒绝记录</td></tr>'}</tbody></table>`;
 let rejects=$('rejections');if(!rejects){rejects=document.createElement('section');rejects.id='rejections';rejects.className='detail';$('detail').after(rejects)}rejects.innerHTML=rejectionHtml;
 const d=$('diagram');d.style.minWidth=p.blocks.length?`${p.blocks.length*324+8}px`:'0';
 d.innerHTML=p.blocks.length?p.blocks.map(x=>{const sel=b?.id===x.id,hl=sel&&pref?new Set(pref.member_matches||[]):new Set();return `<article class="block ${sel?'selected':''} ${x.active?'':'dirty'}" data-block="${esc(x.id)}"><div class="block-head"><button data-select="${esc(x.id)}">Block ${esc(x.id)}</button><span class="badge">${x.active?'有效':'待重新验证'}</span></div><div class="entry"><small>入口 LHS prefix</small><div class="formula">${esc(x.entry_lhs)}</div></div><div class="roots">当前根：<strong>${esc((x.current_root_classes||[]).join(', ')||'关系行入口')}</strong></div>${eventGraph(x,hl,!!pref?.usable)}<div class="export">潜在导出 · ${(x.outputs||[]).length} 条${(x.outputs||[]).map(o=>`<code>${esc(factLabel(o.current))} · 写入 #${esc(o.write)}</code>`).join('')}</div></article>`}).join(''):'<div class="empty">尚未形成有依赖见证的 block。</div>';
 d.querySelectorAll('[data-select]').forEach(el=>el.onclick=()=>{$('block').value=el.dataset.select;setBlock()});
 if(!b){$('detail').innerHTML='<h2>等待组合见证</h2><p class="muted">此处不把普通 match 自动当作 block。</p>';return}
 const bindings=pref?Object.entries(pref.bindings||{}):Object.entries(b.entry_bindings||{});const canonical=pref?.canonical_bindings||{};
 $('detail').innerHTML=`<h2>Block ${esc(b.id)} · Prefix 与边界</h2><div class="selection"><div class="muted">${pref?`${esc(pref.rules.join(' → '))} · ${pref.usable?'当前有效':'历史见证，当前不可直接使用'}`:'此交汇块仅保留明确的入口模式，未生成等价组合'}</div><div class="formula">${esc(pref?pref.lhs+'  →  '+pref.rhs:b.entry_lhs)}</div>${bindings.length?`<table><thead><tr><th>端口</th><th>见证时的绑定</th><th>当前 canonical 绑定</th></tr></thead><tbody>${bindings.map(([k,v])=>`<tr><td>${esc(k)}</td><td>${esc(v)}</td><td>${esc(canonical[k]||'—')}</td></tr>`).join('')}</tbody></table>`:''}</div><div class="detail-grid"><div><h2>输入边界</h2><table><thead><tr><th>来源</th><th>实际读取</th><th>消费事件</th></tr></thead><tbody>${(b.boundary||[]).map(r=>`<tr><td>${r.source_block===null?'输入 / 来源未知':'Block '+esc(r.source_block)}</td><td>${esc(factLabel(r.current))}<br><span class="muted">read #${esc(r.read)}</span></td><td>#${esc(r.consumer)}</td></tr>`).join('')||'<tr><td colspan="3">无已记录外部读取</td></tr>'}</tbody></table></div><div><h2>归属与失效</h2><p>版本 ${esc(b.version)} · ${b.members.length} 个成员 · 成员容量 ${esc(b.member_capacity)}</p><p class="muted">同一来源 block 的有效依赖继续增长；多来源消费形成交汇块。这里没有根据几何距离或 e-class union 自动合并。</p>${(b.invalidations||[]).map(x=>`<p class="error">${esc(x)}</p>`).join('')}<details><summary>支撑此 prefix 的读取事件</summary><div class="formula">${esc((pref?.supporting_reads||[]).map(x=>'read #'+x).join(', ')||'无组合 prefix')}</div></details></div></div>`;

}
function drawLinks(){const d=$('diagram');d.querySelector('.links')?.remove();const p=current();if(!p.interactions?.length)return;const bounds=d.getBoundingClientRect();let lines='';p.interactions.forEach((e,i)=>{const target=d.querySelector(`[data-block="${e.target}"]`);if(!target)return;const t=target.getBoundingClientRect(),tx=t.left-bounds.left+t.width/2,ty=t.top-bounds.top;for(const parent of e.parents){const n=d.querySelector(`[data-block="${parent}"]`);if(!n)continue;const a=n.getBoundingClientRect(),ax=a.left-bounds.left+a.width/2,ay=a.top-bounds.top;const y=14+i*16;lines+=`<path d="M${ax},${ay} C${ax},${y} ${tx},${y} ${tx},${ty}" fill="none" stroke="#a55c14" stroke-width="1.7" marker-end="url(#cross-arrow)"/>`}lines+=`<text x="${tx}" y="${20+i*16}" text-anchor="middle" fill="#a55c14" font-size="12">${esc(e.rule)} · 跨块读取</text>`});d.insertAdjacentHTML('afterbegin',`<svg class="links" width="${d.scrollWidth}" height="${d.scrollHeight}" aria-hidden="true"><defs><marker id="cross-arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7" fill="#a55c14"/></marker></defs>${lines}</svg>`)}

$('load').onchange=async()=>{try{const f=$('load').files[0];if(!f)return;const next=JSON.parse(await f.text());if(!Array.isArray(next.cases)||next.cases.some(c=>!Array.isArray(c.phases)))throw Error('文件缺少 cases/phases');data=next;$('error').textContent='';init()}catch(e){$('error').textContent=e.message}};
try{init()}catch(e){$('error').textContent=e.message}
</script></body></html>
