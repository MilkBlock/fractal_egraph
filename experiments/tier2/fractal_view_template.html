<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Fractal · 推理折叠视图</title>
<style>
:root{font-family:system-ui,sans-serif;color:#173b38;background:#f4f5ee}*{box-sizing:border-box}body{margin:0}header{padding:28px 32px;background:#173b38;color:#fafbf4}header h1{font-size:28px;margin:8px 0}header p{max-width:960px;color:#d4e2d9;line-height:1.6}header a{color:#d3edb0}main{display:grid;grid-template-columns:minmax(340px,1fr) minmax(360px,1.05fr);gap:20px;padding:24px;max-width:1600px;margin:auto}.card,aside{background:#fffef8;border:1px solid #dce3d4;border-radius:16px}.card{padding:20px;margin-bottom:16px}.card h2{font-size:18px;margin:0 0 8px}.muted{color:#62756b;font-size:14px;line-height:1.6}.track{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:16px 0 6px}.track button{border:1px solid #b9cdbe;border-radius:12px;background:#f4f7ef;color:#173b38;min-width:48px;height:48px;padding:0 14px;font-size:16px;cursor:pointer}.track .trigger{background:#fff0cc;border-color:#dab973}.track .future{border-style:dashed;color:#718177}.track button[aria-pressed=true]{background:#174d40;color:white;box-shadow:0 0 0 3px #bedbac}.arrow{color:#91a998}.tag{display:inline-block;padding:4px 8px;background:#edf3e2;border-radius:6px;font-size:12px}.stats{display:flex;flex-wrap:wrap;gap:18px}.stats b{font-size:24px;color:white}aside{padding:24px;align-self:start;position:sticky;top:16px;max-height:calc(100vh - 32px);overflow:auto}aside h2{font-size:22px;margin-top:0}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#eff3ee;border-radius:8px;padding:14px;font-size:13px;line-height:1.65;color:#1d3932}details{margin-top:16px}summary{cursor:pointer;font-weight:600}a{color:#176652}.notice{padding:12px;border-left:3px solid #bd8c3b;background:#fff4dc;line-height:1.6}button:focus-visible,a:focus-visible{outline:3px solid #c58b30;outline-offset:3px}#links{line-height:1.8}#why{line-height:1.75}#future-box{line-height:1.8}#source-box{margin-top:12px}.small{font-size:12px}.label{font-weight:600;margin-top:18px}.current-step{font-weight:normal;color:#567261}@media(max-width:850px){main{grid-template-columns:1fr;padding:14px}header{padding:20px}aside{position:static;max-height:none}.card{padding:16px}}
</style>
<header><div class="small">TIER-2 / WITNESSED FRACTAL VIEW</div><h1>把重复推理折叠成一条轨道</h1><p>黄色是稳定展开前的上下文；数字是已经发生的应用。点击任意位置，查看触发接口和对应结果。虚线省略号表示尚未验证的延伸，不会生成假节点。</p><div id="stats" class="stats"></div><p class="small" id="coverage"></p><a href="index.html">完整 tier-2 检查页</a> · <a href="../tier1_extract/index.html">全部 tier-1 组合</a></header>
<main><section id="tracks" aria-label="Fractal 推理轨道"></section><aside id="inspector" aria-live="polite"><h2 id="detail-title"></h2><div id="tags"></div><p id="why"></p><div id="future-box" hidden></div><div id="known-box"><p id="links"></p><div class="label">规则公式</div><pre id="equation"></pre><div class="label">稳定阶段的参数更新</div><pre id="update"></pre><details id="source-box" open><summary id="source-title">对应原规则</summary><pre id="source"></pre></details><details id="result-box" open><summary>这一位置的完整 tier-0 组合结果</summary><pre id="result"></pre></details><details><summary>接口与依赖证据</summary><pre id="evidence"></pre></details><details><summary>FractalComb 表示</summary><pre id="higher"></pre></details><details><summary>tier-1 原始表示</summary><pre id="tier1"></pre></details></div></aside></main>
<script id="data" type="application/json">__DATA__</script>
<script>
const data=JSON.parse(document.getElementById('data').textContent),$=id=>document.getElementById(id);
function text(id,value){$(id).textContent=value}
text('coverage',`采集：${data.capture ? (data.capture.rounds == null ? "原文件 schedule" : data.capture.rounds+" 轮") : "固定快照"}。此视图覆盖 ${data.stats.visible_unique_contexts} / ${data.stats.total_comb_templates} 个组合模板；其余不在本次 fractal 区域内，默认隐藏。这不是整个 tier-0 图的无损压缩率。`);
for(const [n,label] of [[data.stats.maximal_chains,'条最大轨道'],[data.stats.applications,'次已观察应用'],[data.stats.higher_rules,'个 FractalComb 已合并展示']]){let d=document.createElement('div');let b=document.createElement('b');b.textContent=n;d.append(b,document.createTextNode(' '+label));$('stats').append(d)}
function addButton(track,lane,key,label,cls){let b=document.createElement('button');b.type='button';b.textContent=label;b.className=cls||'';b.dataset.lane=lane.id;b.dataset.step=key;b.setAttribute('aria-label',`${lane.id} ${key==='trigger'?'trigger 上下文':key==='future'?'未验证的延伸':'第 '+key+' 次应用'}`);b.setAttribute('aria-pressed','false');b.onclick=()=>{location.hash=lane.id+'/'+key};track.append(b)}
for(const lane of data.lanes){let card=document.createElement('article');card.className='card';let h=document.createElement('h2');h.textContent=`${lane.rule} · ${lane.events.length} 次稳定展开`;let meta=document.createElement('div');meta.className='muted';meta.textContent=`${lane.id} / ${lane.operator} · 保留实际父依赖，不拼接无关实例`;card.append(h,meta);let track=document.createElement('div');track.className='track';addButton(track,lane,'trigger','trigger','trigger');for(let i=1;i<=lane.events.length;i++){let arrow=document.createElement('span');arrow.className='arrow';arrow.textContent='→';track.append(arrow);addButton(track,lane,String(i),String(i))}addButton(track,lane,'future','…','future');card.append(track);let note=document.createElement('p');note.className='muted';note.textContent='重复前缀不再单独画图；细节只在点击后渲染。';card.append(note);$('tracks').append(card)}
function show(){let [id,key]=location.hash.slice(1).split('/');let lane=data.lanes.find(l=>l.id===id)||data.lanes[0];if(!lane){text('detail-title','本轮未发现连续 fractal 链');text('why','采集已完成，但没有满足当前识别条件的 FractalComb。');$('known-box').hidden=true;return;}if(!['trigger','future',...lane.events.map((_,i)=>String(i+1))].includes(key))key='trigger';
for(const b of document.querySelectorAll('.track button'))b.setAttribute('aria-pressed',String(b.dataset.lane===lane.id&&b.dataset.step===key));
text('higher',lane.higher);$('known-box').hidden=key==='future';$('future-box').hidden=key!=='future';
if(key==='future'){text('detail-title',`${lane.rule} · …`);text('tags','延伸候选 / 非已观察应用');text('why',`这条轨道目前只验证到第 ${lane.events.length} 次。`);text('future-box','相同的 relative-binding 更新方式提示后续可能继续。但当前数据没有第 '+(lane.events.length+1)+' 次应用，也未证明它的触发前提始终成立。因此这里不生成结果、不虚构 e-node。');return}
let event=key==='trigger'?lane.trigger:lane.events[Number(key)-1],node=data.nodes[event];text('detail-title',key==='trigger'?`${lane.rule} 的 trigger 位置`:`${lane.rule} · 第 ${key} 次应用`);text('tags',`${node.comb} · 事件 ${event} · ${node.kind}`);
text('why',key==='trigger'?`这是稳定链开始前的已观察上下文，由 ${node.rule} 形成。它提供下一次应用所需的接口；点击数字 1 可查看消费哪些父输出。此位置不是已证明的最小充分触发条件。`:`本步消费前一位置的输出，使用 ${lane.operator} 的相同接口更新方式。下方给出这一位置已有的整条组合，而不是假设未来展开。`);
$('links').replaceChildren();let a=document.createElement('a');a.href='../tier1_extract/index.html#'+node.comb.slice(1);a.textContent='在 tier-1 中定位 '+node.comb;$('links').append(a);
text('equation',node.equation);text('update',lane.update.join('\n'));text('source-title',key==='trigger'?'形成这个上下文的原规则':'本步 apply 的原规则');text('source',node.source);text('result',node.combined||'尚不能导出单条 tier-0 规则：'+(node.reason||'无可用降级结果'));text('tier1',node.fractal_view?.egg||node.tier1);text('evidence',JSON.stringify({event,parent_events:node.parent_events,external_interfaces:node.external_routes,consumed_parent_roles:node.source_routes,fractal_view:node.fractal_view,fractal_facts:node.fractal_facts},null,2));
}window.addEventListener('hashchange',show);show();
</script></html>
